name: tests

on:
  workflow_dispatch:
  # push/pull_request махнати на 13.09.2026: TIFLO още не е деплойнат,
  # тестовете падат и вдигат имейл при всеки push. Връщат се, когато
  # worker-ът тръгне и тестовете минават.

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q
