name: demo audio

on:
  workflow_dispatch:
  push:
    paths: ["tools/make_demo.py", ".github/workflows/demo-audio.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: инструменти
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: синтез
        run: python -m tools.make_demo addon/audio/tiflo-demo.mp3

      - name: качване в репото
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f addon/audio/tiflo-demo.mp3
          git diff --cached --quiet && echo "без промяна" && exit 0
          git commit -m "demo audio: регенерирано от tools/make_demo.py"
          git push
