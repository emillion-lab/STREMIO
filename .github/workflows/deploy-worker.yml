name: Deploy Worker

on:
  workflow_dispatch:
  push:
    paths: ["worker/src/**", ".github/workflows/deploy-worker.yml"]

concurrency:
  group: deploy-tiflo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: проверка на синтаксиса
        run: node --check worker/src/index.js && echo "syntax OK"

      - name: Deploy via Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACC="74820d71c551391ce31d309c2fcb091c"
          if [ -z "$CF_TOKEN" ]; then
            echo "липсва secret CLOUDFLARE_API_TOKEN в това репо"; exit 1
          fi

          META='{
            "main_module":"index.js",
            "keep_bindings":["secret_text","plain_text"],
            "bindings":[
              {"type":"kv_namespace","name":"STATE",
               "namespace_id":"9ae602e7e49e47f996e7e146a949c766"},
              {"type":"r2_bucket","name":"AUDIO","bucket_name":"tiflo-audio"}
            ],
            "compatibility_date":"2026-01-01"
          }'

          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/tiflo" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=$META;type=application/json" \
            -F "index.js=@worker/src/index.js;type=application/javascript+module" \
            -o /tmp/cf.json || true

          echo "--- отговор от Cloudflare ---"
          head -c 900 /tmp/cf.json; echo

          python3 -c "
          import json,sys
          d=json.load(open('/tmp/cf.json'))
          if not d.get('success'):
              print('ДЕПЛОЯТ ПАДНА:', json.dumps(d.get('errors'), ensure_ascii=False))
              sys.exit(1)
          print('деплой ОК')
          "

      - name: включване на workers.dev поддомейна
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACC="74820d71c551391ce31d309c2fcb091c"
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/tiflo/subdomain" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"enabled":true}' | head -c 300
          echo

      - name: проверка на живо
        run: |
          sleep 8
          echo "--- manifest ---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://tiflo.mihov-emil.workers.dev/manifest.json"
          curl -s "https://tiflo.mihov-emil.workers.dev/manifest.json" | head -c 300
          echo
          echo "--- stream за непознат филм (очаква се празен списък) ---"
          curl -s "https://tiflo.mihov-emil.workers.dev/stream/movie/tt0133093.json"
          echo
